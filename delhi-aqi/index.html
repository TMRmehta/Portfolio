<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi AQI - Tushar Mehta</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .navbar-logo a {
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0f172a;
        }
        
        .navbar-logo a:hover {
            color: #2563eb;
        }
        
        .navbar-nav {
            display: flex;
            gap: 2rem;
        }
        
        .navbar-nav a {
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .navbar-nav a:hover {
            color: #2563eb;
        }
        
        .app-container {
            margin-top: 70px;
            width: 100%;
            height: calc(100vh - 70px);
        }
        
        .streamlit-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <a href="/">Tushar Mehta</a>
        </div>
        <div class="navbar-nav">
            <a href="/">Home</a>
            <a href="/research.html">Research</a>
            <a href="/community.html">Community</a>
            <a href="/experiences.html">Experiences</a>
        </div>
    </nav>
    
    <div class="app-container">
        <iframe 
            class="streamlit-frame"
            src="https://delhi-aqi-app-192262207218.europe-west1.run.app/"
            title="Delhi AQI App">
        </iframe>
    </div>
</body>
</html>
